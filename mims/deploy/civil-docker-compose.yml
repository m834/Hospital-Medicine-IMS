# ============================================================
# M-IMS Production — civil.codehustlerssol.com
# ============================================================

services:

  # --- PostgreSQL -------------------------------------------
  civil-postgres:
    image: postgres:16-alpine
    container_name: civil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - civil_postgres_data:/var/lib/postgresql/data
    networks:
      - civil-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ------------------------------------------------
  civil-redis:
    image: redis:7-alpine
    container_name: civil-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - civil_redis_data:/data
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend API ------------------------------------------
  civil-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: civil-mims-backend:latest
    container_name: civil-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: civil-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@civil-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      API_PREFIX: ${API_PREFIX}
      STORAGE_PROVIDER: local
      HOSPITAL_TIMEZONE: ${HOSPITAL_TIMEZONE}
      HOSPITAL_LOCALE: ${HOSPITAL_LOCALE}
      FIFO_ALLOCATION_ENABLED: ${FIFO_ALLOCATION_ENABLED}
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY}
      BACKUP_DIR: /app/backups
    volumes:
      - ./license.key:/app/license.key:ro
      # A named volume, not a bind mount. Docker creates a missing bind-mount
      # directory owned by root, which the container's non-root user cannot
      # write to — that needs a chown by hand on every new deployment, and a
      # deployment that needs a manual step is a deployment that fails. A named
      # volume inherits the ownership baked into the image, so it works on any
      # host with nothing to run. Backups are retrieved from the Super Admin
      # screen, which is why host-shell access to the files is not needed.
      - civil_backups:/app/backups
    depends_on:
      civil-postgres:
        condition: service_healthy
      civil-redis:
        condition: service_healthy
    networks:
      - civil-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # --- Frontend ---------------------------------------------
  civil-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${FRONTEND_URL}
    image: civil-mims-frontend:latest
    container_name: civil-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${FRONTEND_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - civil-backend
    networks:
      - civil-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # --- Nginx Reverse Proxy ----------------------------------
  civil-nginx:
    image: nginx:alpine
    container_name: civil-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      - civil-frontend
      - civil-backend
    networks:
      - civil-network

networks:
  civil-network:
    driver: bridge

volumes:
  civil_postgres_data:
    driver: local
  civil_redis_data:
    driver: local
  # Database backups. Survives container recreation, so a rebuild never
  # discards them.
  civil_backups:
    driver: local
