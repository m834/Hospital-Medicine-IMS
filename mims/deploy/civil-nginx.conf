server {
    listen 80;
    server_name civil.codehustlerssol.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide server version
    server_tokens off;

    # Frontend
    location / {
        proxy_pass         http://civil-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Database backups — dumping a large database takes minutes, and the 60s
    # on /api/ below would cut the connection mid-dump. Declared before /api/
    # so it wins for this path only: raising the limit for every endpoint would
    # let any slow request hold a connection for a quarter of an hour.
    location /api/v1/backups {
        proxy_pass         http://civil-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # A dump is streamed out; buffering it would defeat that
        proxy_buffering    off;
        # Restore uploads a whole dump. The 25m that suits an Excel import
        # would reject a real database, and nginx rejects it before the
        # application ever sees the request.
        client_max_body_size 2g;
    }

    # Backend API
    location /api/ {
        proxy_pass         http://civil-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
}
