# ============================================================
# M-IMS Production Docker Compose
# ============================================================
# IMPORTANT: Before starting, ensure license.key exists at
# ./license.key (generated via: npm run license:generate)
# ============================================================

version: '3.9'

services:
  # ─── PostgreSQL Database ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mims_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT exposed to host — only accessible within Docker network
    expose:
      - "5432"
    networks:
      - mims_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mims_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - mims_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Obfuscated) ───────────────────────────────
  backend:
    image: mims-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USERNAME:-mims_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mims_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:3000
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY}
    volumes:
      # License file is mounted read-only — never baked into image
      - ./license.key:/app/license.key:ro
      # Audit logs (persisted)
      - license_audit:/app/license-audit
    ports:
      - "127.0.0.1:3001:3001"   # Bind to localhost only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mims_internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ─── Frontend (Production Build) ────────────────────────
  frontend:
    image: mims-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3000:3000"   # Bind to localhost only
    depends_on:
      - backend
    networks:
      - mims_internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ─── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - mims_internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  license_audit:
    driver: local

networks:
  mims_internal:
    driver: bridge
    internal: false
