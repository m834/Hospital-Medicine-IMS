services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mims-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mims_dev
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mims-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mims-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mims-network

  # MinIO Object Storage (S3-compatible) - Optional, can be started separately
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mims-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - mims-network
    profiles:
      - full

  # Adminer (Database Management UI)
  adminer:
    image: adminer:4.8.1
    container_name: mims-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - mims-network
    profiles:
      - full

  # Redis Commander (Redis Management UI)
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: mims-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - mims-network
    profiles:
      - full

networks:
  mims-network:
    driver: bridge
    name: mims-network

volumes:
  postgres_data:
    name: mims-postgres-data
  redis_data:
    name: mims-redis-data
  minio_data:
    name: mims-minio-data
